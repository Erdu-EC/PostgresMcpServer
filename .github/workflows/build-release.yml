name: Build & Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
            ext: .exe
          - os: ubuntu-24.04
            rid: linux-x64
            ext: ""
          - os: ubuntu-24.04
            rid: linux-musl-x64
            ext: ""
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install musl tools (linux-musl)
        if: matrix.rid == 'linux-musl-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Restore
        run: dotnet restore PostgresMcpServer.csproj

      - name: Publish AOT
        run: dotnet publish PostgresMcpServer.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o publish/${{ matrix.rid }}

      - name: Package artifact (Windows)
        if: matrix.os == 'windows-2025'
        shell: pwsh
        run: |
          Compress-Archive -Path publish/${{ matrix.rid }}/PostgresMcpServer${{ matrix.ext }} -DestinationPath publish/postgres-mcp-${{ matrix.rid }}.zip

      - name: Package artifact (Linux)
        if: matrix.os != 'windows-2025'
        shell: bash
        run: |
          cd publish/${{ matrix.rid }}
          zip -j ../postgres-mcp-${{ matrix.rid }}.zip PostgresMcpServer${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: postgres-mcp-${{ matrix.rid }}
          path: publish/postgres-mcp-${{ matrix.rid }}.zip

  version:
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        shell: bash
        run: |
          # Read MAJOR.MINOR from the .csproj <Version> element
          CSPROJ_VERSION=$(grep -oP '<Version>\K[0-9]+\.[0-9]+' PostgresMcpServer.csproj)
          MAJOR=$(echo "$CSPROJ_VERSION" | cut -d. -f1)
          MINOR=$(echo "$CSPROJ_VERSION" | cut -d. -f2)

          # Count tags matching vMAJOR.MINOR.* to determine the next PATCH
          PATCH=$(git tag -l "v${MAJOR}.${MINOR}.*" | wc -l)
          PATCH=$((PATCH + 1))

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Generated version: ${VERSION} (tag: ${TAG})"

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ steps.version.outputs.tag }} -m "Release ${{ steps.version.outputs.tag }}"
          git push origin ${{ steps.version.outputs.tag }}

  release:
    needs: [build, version]
    runs-on: ubuntu-24.04

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Release ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: |
            postgres-mcp-win-x64/postgres-mcp-win-x64.zip
            postgres-mcp-linux-x64/postgres-mcp-linux-x64.zip
            postgres-mcp-linux-musl-x64/postgres-mcp-linux-musl-x64.zip
